name: Bug report
description: Report a reproducible non-sensitive bug using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, use SECURITY.md and report privately.
        Never include secrets, client/matter data, privileged content or private security findings.
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
      description: Describe the difference and relevant scenario.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or source commit
      placeholder: "0.1.0 / source SHA"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction using synthetic inputs
      description: Include commands, OS/architecture, and a minimal safe example. Sanitize any logs.
    validations:
      required: true
  - type: checkboxes
    id: data_boundary
    attributes:
      label: Content check
      options:
        - label: This report contains no secrets, restricted data or private security details.
          required: true
