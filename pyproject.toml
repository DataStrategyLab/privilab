[build-system]
requires = ["uv_build==0.13.4"]
build-backend = "uv_build"

[project]
name = "privilab"
version = "0.1.0"
description = "Controlled legal-AI reference demo bootstrap"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "certifi==2026.10.19",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "openai>=3.19.2,<4",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
]

[tool.uv]
required-version = "==0.13.4"
package = true

[tool.uv.sources]
certifi = { url = "https://files.pythonhosted.org/packages/c4/51/29046e48f693c54e5b7412216d447a1d8362c9653148d98c02cdf65fa733/certifi-2026.10.19-py3-none-any.whl" }

[tool.uv.build-backend]
module-name = "privilab"
module-root = "src"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
